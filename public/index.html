<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Initiativtavlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* Layout: luftig toppnavigering i UnderDB-anda. Vit grund, tonade blå kort med stora radier, stora blå rubriker med tät spärrning. */
:root {
  --bg: #FFFFFF; --surface: #F2F6FF; --surface-2: #E6EEFF; --ink: #16203A; --muted: #5A6785;
  --line: #DCE5F7; --accent: #2457D6; --accent-ink: #FFFFFF; --accent-soft: #E3ECFF; --accent-strong: #1A43AE;
  --signal: #C2531B; --signal-soft: #FDEBDF; --danger: #B3261E; --card: #FFFFFF;
  --i-upk: #2457D6; --i-obkn: #B7791F; --i-kas: #7C4DCC; --i-hs30: #0E8A7D; --i-kio: #C2531B; --i-gka: #4E8A1F; --i-lfm30: #3F5878; --i-ccc: #A3367A; --i-bruka: #8A5A3C; --i-k2030: #0F6E9E; --i-coaction: #B03A48; --i-gpkb: #8C7A0B; --i-vks: #0B6B4B; --i-hbg: #8E2AB5; --i-shift: #00838F; --on-init: #FFFFFF;
  --font-display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Inter", "Helvetica Neue", Arial, sans-serif;
  --r: 8px; --r-lg: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1222; --surface: #131D33; --surface-2: #1B2843; --ink: #E8EEFB; --muted: #9AA8C6;
  --line: #24324F; --accent: #82A6FF; --accent-ink: #0B1222; --accent-soft: #1A2A4D; --accent-strong: #A9C2FF;
  --signal: #F2A06E; --signal-soft: #3A2516; --danger: #F2938B; --card: #101A2E;
  --i-upk: #82A6FF; --i-obkn: #E3B45A; --i-kas: #B597F0; --i-hs30: #5CC9BB; --i-kio: #F2A06E; --i-gka: #9CCB67; --i-lfm30: #A3B5D1; --i-ccc: #E58BC4; --i-bruka: #D6A47F; --i-k2030: #6CC0E8; --i-coaction: #F08A96; --i-gpkb: #D9C75A; --i-vks: #5FCFA4; --i-hbg: #D08AF0; --i-shift: #5FD6E0; --on-init: #0B1222;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1222; --surface: #131D33; --surface-2: #1B2843; --ink: #E8EEFB; --muted: #9AA8C6;
  --line: #24324F; --accent: #82A6FF; --accent-ink: #0B1222; --accent-soft: #1A2A4D; --accent-strong: #A9C2FF;
  --signal: #F2A06E; --signal-soft: #3A2516; --danger: #F2938B; --card: #101A2E;
  --i-upk: #82A6FF; --i-obkn: #E3B45A; --i-kas: #B597F0; --i-hs30: #5CC9BB; --i-kio: #F2A06E; --i-gka: #9CCB67; --i-lfm30: #A3B5D1; --i-ccc: #E58BC4; --i-bruka: #D6A47F; --i-k2030: #6CC0E8; --i-coaction: #F08A96; --i-gpkb: #D9C75A; --i-vks: #5FCFA4; --i-hbg: #D08AF0; --i-shift: #5FD6E0; --on-init: #0B1222;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2rem, 4.4vw, 2.9rem); font-weight: 700; letter-spacing: -0.045em; color: var(--accent); }
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; color: var(--accent); }
h3 { font-size: 1.02rem; font-weight: 600; letter-spacing: -0.02em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }
.label { font-size: 0.78rem; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.muted { color: var(--muted); }

/* Inloggning */
#gate { min-height: 100vh; display: grid; place-items: center; padding-inline: 16px; padding-block: 48px; }
.gate-box { width: 100%; max-width: 440px; display: grid; gap: 24px; }
.gate-box h1 { font-size: clamp(2rem, 6vw, 2.6rem); }
.gate-box form { display: grid; gap: 14px; background: var(--surface); border-radius: var(--r-lg); padding: 28px; }
.gate-mark { display: flex; gap: 6px; }
.gate-mark { gap: 0; } .gate-mark span { width: 22px; height: 8px; border-radius: 0; } .gate-mark span:first-child { border-radius: 3px 0 0 3px; } .gate-mark span:last-child { border-radius: 0 3px 3px 0; }

/* App-skal: sidomeny */
#app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); align-items: start; }
nav.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; padding-inline: 16px; padding-block: 22px; border-right: 1px solid var(--line); background: var(--bg); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.brand::before { content: ""; width: 26px; height: 22px; flex: none; border-radius: 3px; background: linear-gradient(to right, var(--i-upk) 0.00% 6.67%, var(--i-obkn) 6.67% 13.33%, var(--i-kas) 13.33% 20.00%, var(--i-hs30) 20.00% 26.67%, var(--i-kio) 26.67% 33.33%, var(--i-gka) 33.33% 40.00%, var(--i-lfm30) 40.00% 46.67%, var(--i-ccc) 46.67% 53.33%, var(--i-bruka) 53.33% 60.00%, var(--i-k2030) 60.00% 66.67%, var(--i-coaction) 66.67% 73.33%, var(--i-gpkb) 73.33% 80.00%, var(--i-vks) 80.00% 86.67%, var(--i-hbg) 86.67% 93.33%, var(--i-shift) 93.33% 100.00%); }
.brand b { font-weight: 700; font-size: 1rem; letter-spacing: -0.03em; line-height: 1.2; }
.brand small { display: none; }
.navlist { display: grid; gap: 2px; }
.navlist button { background: none; border: 0; padding: 9px 12px; border-radius: var(--r); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink); text-align: left; font-weight: 500; }
.navlist button:hover { background: var(--surface); }
.navlist button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.navlist .count { font-size: 0.74rem; opacity: 0.65; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: grid; gap: 6px; font-size: 0.8rem; color: var(--muted); padding-inline: 8px; }
.side-foot .btn { justify-self: start; padding-inline: 0; }
main { padding-inline: clamp(16px, 4vw, 48px); padding-block: 40px 80px; max-width: 1280px; margin-inline: auto; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 28px; }
.page-head .sub { color: var(--muted); margin-top: 10px; max-width: 62ch; font-size: 1.02rem; }

/* Knappar */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--r); border: 0; background: var(--surface); color: var(--accent); cursor: pointer; font-weight: 500; font-size: 0.92rem; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: none; color: var(--accent); padding-inline: 4px; }
.btn.ghost:hover { text-decoration: underline; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: 0.55; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Filter */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 16px; background: var(--surface); border-radius: var(--r-lg); margin-bottom: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 0; border-radius: 999px; background: var(--card); cursor: pointer; font-size: 0.84rem; font-weight: 500; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--accent-ink); }
.dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.field { display: grid; gap: 6px; }
.field label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=search], input[type=date], input[type=url], input[type=email], input[type=password], select, textarea {
  border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 9px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 140px; line-height: 1.5; }
.filters input[type=search] { width: 220px; }
.filters select { width: auto; }

/* Taggar */
.init-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 600; }
.theme-tag { display: inline-block; font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.src { font-size: 0.74rem; color: var(--muted); }
.src.manual { color: var(--signal); }

/* Sektioner */
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; }
.section { display: grid; gap: 16px; align-content: start; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

/* Utvald avstämning */
.feature { background: var(--accent); color: var(--accent-ink); border-radius: var(--r-lg); padding: clamp(22px, 4vw, 40px); display: grid; gap: 22px; position: relative; overflow: hidden; }
.feature::after { content: ""; position: absolute; inset: 0 0 0 55%; pointer-events: none; background-image: linear-gradient(color-mix(in srgb, var(--accent-ink) 9%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--accent-ink) 9%, transparent) 1px, transparent 1px); background-size: 28px 28px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); mask-image: linear-gradient(90deg, transparent, #000 60%); }
.feature .label, .feature .muted, .feature .init-tag { color: inherit; }
.feature .muted { opacity: 0.8; }
.feature-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
.feature-label { opacity: 0.85; }
.feature-title { font-size: clamp(1.6rem, 3.4vw, 2.3rem); margin-top: 8px; color: inherit; letter-spacing: -0.04em; }
.feature .btn.primary { background: var(--accent-ink); color: var(--accent); }
.feature .btn.primary:hover { opacity: 0.92; }
.feature-syn { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; position: relative; z-index: 1; }
.feature-syn > div { background: color-mix(in srgb, var(--accent-ink) 12%, transparent); border-radius: var(--r); padding: 14px 16px; }
.feature-syn p { font-size: 0.95rem; margin-top: 6px; }
.feature-ups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; position: relative; z-index: 1; }
.feature-ups p { font-size: 0.87rem; opacity: 0.85; margin-top: 6px; }
.feature .dot { box-shadow: 0 0 0 2px var(--accent-ink); }
.empty-feature { justify-items: start; }

/* På gång */
.news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.news { display: grid; grid-template-rows: auto 1fr; background: color-mix(in srgb, var(--c) 6%, var(--bg)); border-bottom: 3px solid var(--c); border-radius: var(--r-lg); overflow: hidden; text-decoration: none; color: var(--ink); transition: transform .18s, box-shadow .18s; }
.news:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -14px color-mix(in srgb, var(--accent) 45%, transparent); }
.news-img { aspect-ratio: 16 / 8; max-width: 100%; position: relative; overflow: hidden; color: var(--ink); padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  background-color: color-mix(in srgb, var(--c) 16%, var(--bg));
  background-image: linear-gradient(color-mix(in srgb, var(--c) 18%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, transparent) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; }
.news-img.has-img { background-image: none; background-color: color-mix(in srgb, var(--c) 45%, #fff); }
.news-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); mix-blend-mode: multiply; }
.news-badge { position: relative; z-index: 1; background: var(--c); color: var(--on-init); font-size: 0.76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.news-img em { position: relative; z-index: 1; font-style: normal; font-size: 0.74rem; background: color-mix(in srgb, var(--bg) 88%, transparent); color: var(--ink); padding: 3px 10px; border-radius: 999px; font-weight: 500; }
.example-banner { position: relative; z-index: 1; background: repeating-linear-gradient(135deg, var(--signal-soft) 0 14px, color-mix(in srgb, var(--signal-soft) 70%, var(--bg)) 14px 28px); color: var(--ink); border: 2px dashed var(--signal); border-radius: var(--r); padding: 10px 14px; font-size: 0.92rem; }
.example-banner strong { color: var(--signal); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.8rem; margin-right: 8px; }
.news-body { padding: 14px 16px 16px; display: grid; gap: 12px; align-content: space-between; }
.news-body h3 { font-size: 1rem; line-height: 1.3; color: var(--ink); }
.news-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
a.out { color: inherit; text-decoration: none; }
a.out:hover { text-decoration: underline; color: var(--accent); }

/* Material & verktyg */
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.res { display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 8px; background: color-mix(in srgb, var(--ic) 11%, var(--bg)); border-radius: var(--r-lg); padding: 16px 18px; text-decoration: none; color: var(--ink); border-top: 4px solid var(--ic); transition: transform .15s, box-shadow .15s; }
.res:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px color-mix(in srgb, var(--accent) 45%, transparent); }
.res-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.res-type { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: color-mix(in srgb, var(--ic) 70%, var(--ink)); }
.res .theme-tag { background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--ink); }
.res-get { color: color-mix(in srgb, var(--ic) 70%, var(--ink)) !important; }
.res h3 { font-size: 1rem; line-height: 1.3; }
.res p { font-size: 0.86rem; color: var(--muted); line-height: 1.45; }
.res-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.res-get { font-size: 0.82rem; font-weight: 600; color: var(--accent); }

/* Vad händer just nu */
.now-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.now-card { background: var(--surface); border-radius: var(--r-lg); padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.now-card .card-init { color: color-mix(in srgb, var(--ic) 70%, var(--ink)); }
.now-card p { font-size: 0.92rem; }
.now-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.86rem; }


/* Anslagstavla */
.board-wrap { overflow: auto; border-radius: var(--r-lg); background: var(--surface); max-height: 75vh; overscroll-behavior: contain; }
.pinboard { position: relative; background-image: radial-gradient(color-mix(in srgb, var(--accent) 22%, transparent) 1.2px, transparent 1.3px); background-size: 24px 24px; }
.board-empty { position: absolute; left: 40px; top: 40px; max-width: 360px; display: grid; gap: 6px; color: var(--muted); padding: 20px; border: 2px dashed var(--line); border-radius: var(--r-lg); background: var(--bg); }
.board-empty b { color: var(--ink); }
.pnote { position: absolute; width: 220px; min-height: 130px; padding: 12px 14px 10px; display: grid; gap: 8px; grid-template-rows: auto 1fr auto; background: color-mix(in srgb, var(--ic) 20%, var(--bg)); border-top: 5px solid var(--ic); border-radius: 4px 4px 10px 10px; box-shadow: 0 8px 18px -10px rgba(10, 25, 60, 0.45); cursor: grab; touch-action: none; user-select: none; transition: box-shadow .15s; }
.pnote:hover { box-shadow: 0 14px 26px -12px rgba(10, 25, 60, 0.55); }
.pnote.dragging { cursor: grabbing; z-index: 30; box-shadow: 0 22px 40px -14px rgba(10, 25, 60, 0.6); transform: rotate(0deg) scale(1.03) !important; transition: none; }
.pnote-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.pnote-type { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: color-mix(in srgb, var(--ic) 75%, var(--ink)); }
.pnote-x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0 2px; border-radius: 4px; }
.pnote-x:hover { color: var(--danger); }
.pnote-x.confirm { font-size: 0.72rem; color: var(--bg); background: var(--danger); padding: 3px 6px; font-weight: 600; }
.pnote-text { font-size: 0.92rem; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.pnote-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.pnote-init { font-size: 0.72rem; font-weight: 600; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pnote-plus { flex: none; border: 0; cursor: pointer; font-size: 0.74rem; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--ink); }
.pnote-plus:hover { background: var(--bg); }
.pnote-plus[aria-pressed="true"] { background: var(--ic); color: var(--on-init); }
.pnote-also { display: flex; gap: 4px; flex-wrap: wrap; }

/* Arkiv */
.archive { display: grid; gap: 6px; }
.arch-month { font-size: 1.1rem; margin-top: 18px; }
.arch-list { display: grid; background: var(--surface); border-radius: var(--r-lg); padding: 4px 16px; }
.arch-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding-block: 11px; border-bottom: 1px solid var(--line); }
.arch-row:last-child { border-bottom: 0; }
.arch-date { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.88rem; }
.arch-title { font-weight: 600; }
@media (max-width: 560px) { .arch-row { grid-template-columns: 52px minmax(0, 1fr); } .arch-row .init-tag { grid-column: 2; } }

/* Evenemangslista */
.ev-list { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 16px; padding: 14px 16px; background: var(--surface); border-radius: var(--r-lg); align-items: start; }
.ev-date { line-height: 1.05; font-variant-numeric: tabular-nums; background: var(--card); border-radius: 12px; padding: 8px 0; text-align: center; }
.ev-date .d { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.04em; color: var(--accent); }
.ev-date .m { font-size: 0.7rem; color: var(--muted); font-weight: 500; }
.ev-date.now { background: var(--accent); }
.ev-date.now .d, .ev-date.now .m { color: var(--accent-ink); }
.ev-body { display: grid; gap: 4px; min-width: 0; }
.ev-title { font-weight: 600; letter-spacing: -0.02em; }
.ev-meta { font-size: 0.86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.ev-side { display: grid; gap: 6px; justify-items: end; text-align: right; font-size: 0.86rem; }
.ev-side a { font-weight: 500; text-decoration: none; }
.ev-side a:hover { text-decoration: underline; }
.week-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); padding-top: 18px; padding-bottom: 2px; }
.week-label.current { color: var(--accent); }

/* Matris */
.matrix-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--r-lg); padding: 6px; }
table.matrix { border-collapse: collapse; width: 100%; font-size: 0.86rem; }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }
function store(k, v) { try { v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function sortEvents(a, b) { return (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || ""); }

// ---------- inloggning ----------
function authed() { return !!(window.IT && IT.auth.isAuthed()); }
$("#gate-form").addEventListener("submit", async e => {

// ---------- data ----------
async function connect() {
  if (S._connected) return; if (!authed()) { S.dbState = "loading"; return; } S._connected = true;
  if (!window.claude || !window.claude.use) { S.dbState = "none"; render(); return; }
  claude.use("sample").then(s => { S.sample = s; if (S.view === "avstamningar") render(); }).catch(() => {});
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { S.dbState = "none"; render(); return; }
  S.db = db; S.dbState = "ok";
  const sub = (name, field) => db.collection(name).onSnapshot(snap => {
    S[field] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => { S.dbState = "error"; render(); });
  sub("events", "events"); sub("groups", "groups"); sub("notes", "notes"); sub("sources", "sources"); sub("news", "news"); sub("network", "network"); sub("resources", "resources"); sub("board", "board"); sub("profiles", "profiles"); sub("contacts", "contacts"); sub("ideas", "ideas");
  claude.use("user").then(async u => { if (u) { try { S.uid = await u.id(); } catch (e) {} } }).catch(() => {});
}

const VIEWS = [
  { key: "oversikt", label: "Översikt" },
  { key: "pagang", label: "På gång" },
  { key: "kalendarium", label: "Kalendarium" },
  { key: "arbetsgrupper", label: "Arbetsgrupper och projekt" },
  { key: "resurser", label: "Material & verktyg" },
  { key: "avstamningar", label: "Avstämningar" },
  { key: "tavla", label: "Anslagstavla" },
  { key: "konferens", label: "Klimattinget" },
  { key: "initiativ", label: "Initiativ" },
];
function go(v) { S.view = v; store("kp-view", v); renderNow(); window.scrollTo(0, 0); }
function renderNav() {
  const counts = {
    pagang: S.news.length,
    resurser: S.resources.length,
    kalendarium: S.events.filter(e => e.date >= ymd(today())).length,
    arbetsgrupper: S.groups.length, avstamningar: S.notes.length, tavla: S.board.length, initiativ: INIT.length,
  };
  const navHtml = VIEWS.map(v => `<button type="button" data-nav="${v.key}" ${S.view === v.key ? 'aria-current="page"' : ""}>${v.label}${counts[v.key] != null ? `<span class="count">${counts[v.key]}</span>` : ""}</button>`).join("");
  const nav = $("#nav");
  if (nav._html !== navHtml) {
    nav._html = navHtml; nav.innerHTML = navHtml;
    const cur = nav.querySelector("[aria-current]"); if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = Math.max(0, cur.offsetLeft - nav.offsetLeft - 16);
    nav.querySelectorAll("button[data-nav]").forEach(b => { b.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); go(b.dataset.nav); }; });
  }
  const last = S.sources.map(s => s.lastSync).filter(Boolean).sort().pop();
  $("#sync-foot").textContent = last ? "Synkat från webbplatserna " + fmtDate(last.slice(0, 10)) : "";
}

let _rq = false;
function render() {
  if (_rq) return; _rq = true;
  Promise.resolve().then(() => { _rq = false; try { renderNow(); } catch (err) { console.error(err); } });
}
function renderNow() {
  if (S.dragging) { S.renderPending = true; return; }
  if ($("#app").hidden) return;
  renderNav();
  const m = $("#main");
  let html = "";
  if (S.dbState === "none") html += `<div class="banner">Delad data kunde inte laddas. Ladda om sidan eller logga in igen.</div>`;
  if (S.dbState === "error") html += `<div class="banner">Anslutningen till den delade datan bröts. Ladda om sidan.</div>`;
  if (S.view === "oversikt") html += viewOverview();
  if (S.view === "pagang") html += viewNews();
  if (S.view === "resurser") html += viewResources();
  if (S.view === "kalendarium") html += viewCalendar();
  if (S.view === "arbetsgrupper") html += viewGroups();
  if (S.view === "avstamningar") html += viewNotes();
  if (S.view === "tavla") html += viewBoard();
  if (S.view === "konferens") html += viewConference();
  if (S.view === "initiativ") html += viewSources();
  if (m._html === html) return;
  m._html = html;
  const bw = document.getElementById("board-wrap"); const bScroll = bw ? [bw.scrollLeft, bw.scrollTop] : null;
  const scroll = window.scrollY;
  const focusId = document.activeElement && document.activeElement.id;
  const sel = focusId && document.activeElement.selectionStart;
  m.innerHTML = html;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  window.scrollTo(0, scroll);
  const bw2 = document.getElementById("board-wrap"); if (bw2 && bScroll) { bw2.scrollLeft = bScroll[0]; bw2.scrollTop = bScroll[1]; }
}

function plusDialog(id) {
  const n = S.board.find(x => x.id === id); if (!n) return;
  if (!S.uid) { toast("Logga in på claude.ai för att markera lappar."); return; }
  const plus = Array.isArray(n.plus) ? [...n.plus] : [];

    const idx = plus.indexOf(S.uid); plus.splice(idx, 1);
    const inits = Array.isArray(n.plusInits) ? [...n.plusInits] : []; inits.splice(idx, 1);
    S.db.doc("board/" + id).update({ plus, plusInits: inits }).catch(() => toast("Kunde inte spara."));

  openDialog(`<h2>Vi också</h2><p class="muted">${esc(n.text)}</p>

  async fd => {
    const k = fd.get("initiative"); store("kp-myinit", k);
    try { await S.db.doc("board/" + id).update({ plus: [...plus, S.uid], plusInits: [...(Array.isArray(n.plusInits) ? n.plusInits : []), k] }); toast("Markerat"); }
    catch (e) { toast("Kunde inte spara."); return false; }
  });
}
// dra lappar
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".pnote"); if (!el || e.target.closest("button") || e.button !== 0) return;
  if (matchMedia("(max-width: 560px)").matches) return;
  const board = document.getElementById("pinboard"); if (!board) return;
  e.preventDefault();
  const br = board.getBoundingClientRect(); const nr = el.getBoundingClientRect();
  const offX = e.clientX - nr.left, offY = e.clientY - nr.top;
  S.dragging = { el, id: el.dataset.noteId, moved: false };
  el.classList.add("dragging"); el.setPointerCapture(e.pointerId);
  const move = ev => {
    const x = Math.max(0, Math.min(BW - el.offsetWidth, ev.clientX - br.left - offX));

    try { await S.db.collection("events").add({ ...d, source: "manuell", createdAt: new Date().toISOString() }); toast("Träffen är tillagd"); }
    catch (e) { toast(e.code === "invalid_argument" ? "Du har inte behörighet att lägga till." : "Kunde inte spara. Försök igen."); return false; }
  });
}

      <div class="field"><label for="g-init">Initiativ</label><select id="g-init" name="initiative">${initOptions(pre.initiative)}</select></div>
      <div class="field"><label for="g-theme">Tema</label><select id="g-theme" name="theme">${themeOptions((pre.themes || [])[0])}</select></div>
      <div class="field"><label for="g-theme2">Andra tema (valfritt)</label><select id="g-theme2" name="theme2">${themeOptions((pre.themes || [])[1], true)}</select></div>
      <div class="field full"><label for="g-desc">Kort beskrivning</label><textarea id="g-desc" name="description" rows="3" style="min-height:80px">${esc(pre.description || "")}</textarea></div>

  openDialog(`<h2>Anslutna organisationer</h2>

function eventDetail(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  openDialog(`<div class="ev-list">${evRow(e)}</div><div class="row" style="justify-content:flex-end"><button class="btn" value="cancel">Stäng</button></div>`, async () => {});

// ---------- tolka anteckningar ----------
function buildPrompt(raw, title, date) {
  return `Du hjälper kanslierna i svenska klimatinitiativ inom bygg- och anläggningsbranschen. Nedan finns anteckningar från en månatlig avstämning där varje initiativ kort berättat vad som händer just nu.

Initiativ (använd nyckeln i fältet "initiative"):
${INIT.map(i => `- ${i.key}: ${i.name} (${i.region})`).join("\n")}

Teman (använd exakt dessa strängar):
${THEMES.join(" | ")}

Svara ENBART med ett JSON-objekt på svenska med denna form:
{"updates":[{"initiative":"nyckel","summary":"2–3 meningar om läget","items":["kort konkret punkt"],"themes":["tema"]}],
 "synergies":[{"theme":"tema","initiatives":["nyckel","nyckel"],"text":"1–2 meningar om vad som överlappar och hur initiativen kan samordna sig"}],
 "suggestedGroups":[{"initiative":"nyckel","name":"namn på ny arbetsgrupp eller projekt som nämns","description":"en mening","themes":["tema"],"status":"planeras|pagar"}],
 "suggestedEvents":[{"initiative":"nyckel","title":"träff som nämns med datum","date":"YYYY-MM-DD","time":"","place":"","theme":"tema"}]}

Regler: ta bara med det som står i anteckningarna. Hitta inte på datum. Utelämna initiativ som inte nämns. Om ett initiativ i texten inte finns i listan, hoppa över det.

Mötet: ${title} (${date})

Anteckningar:
"""
${raw.slice(0, 60000)}
"""`;
}
async function parseAndSave(raw, title, date, existingId) {
  S.parsing = true; S.parseMsg = "Claude läser anteckningarna. Det tar oftast under en minut."; render();
  S._ctl = new AbortController();
  let parsed = null;
  try {
    parsed = await S.sample.json(buildPrompt(raw, title, date), { signal: S._ctl.signal });
    if (!parsed || !Array.isArray(parsed.updates)) throw { code: "invalid_json" };
    S.parseMsg = "";
  } catch (e) {
    const msgs = { cancelled: "Avbrutet.", not_granted: "Claude fick inte användas. Anteckningarna sparas utan sammanfattning.", rate_limited: "För många förfrågningar just nu. Försök igen om en stund.", invalid_json: "Sammanfattningen gick inte att läsa. Försök igen." };
    S.parseMsg = msgs[e.code] || "Något gick fel med sammanfattningen. Försök igen.";
    parsed = null;
  }
  S.parsing = false;
  try {
    if (existingId) { if (parsed) await S.db.doc("notes/" + existingId).update({ parsed }); }
    else {
      const ref = await S.db.collection("notes").add({ title, meetingDate: date, raw: raw.slice(0, 120000), parsed, createdAt: new Date().toISOString() });
      S.noteSel = ref.id; S._uploading = false; S._draftText = ""; S._draftTitle = ""; S._draftDate = "";
    }
    if (parsed) toast("Avstämningen är sammanfattad");
  } catch (e) { S.parseMsg = "Kunde inte spara avstämningen."; }
  render();
}

// ---------- händelser ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-go]"); if (!t) return;
  const ds = t.dataset;
  if (ds.go) { go(ds.go); return; }
  if (ds.f) {
    const set = ds.f === "ev-init" ? S.evInit : ds.f === "nw-init" ? S.nwInit : ds.f === "rs-init" ? S.rsInit : ds.f === "bd-init" ? S.boardInit : S.grInit;
    set.has(ds.k) ? set.delete(ds.k) : set.add(ds.k); render(); return;
  }
  if (ds.mode) { S.evMode = ds.mode; S.monthOffset = 0; render(); return; }
  if (ds.month) { S.monthOffset += Number(ds.month); render(); return; }
  if (ds.grTheme) { S.grTheme = ds.grTheme; render(); return; }
  if (ds.themeJump) { S.grTheme = ds.themeJump; S.grInit.clear(); go("arbetsgrupper"); return; }
  if (ds.evDetail) { eventDetail(ds.evDetail); return; }
  if (ds.jumpInit) {
    const [v, k] = ds.jumpInit.split(":");
    const set = v === "kalendarium" ? S.evInit : v === "resurser" ? S.rsInit : v === "tavla" ? S.boardInit : S.grInit;
    set.clear(); set.add(k); if (v === "arbetsgrupper") S.grTheme = ""; go(v); return;
  }
  if (ds.editProf) { editProfileDialog(ds.editProf); return; }
  if (t.id === "add-idea") { addIdeaDialog(); return; }
  if (ds.vote) { voteIdea(ds.vote); return; }
  if (ds.openNote) { S.noteSel = ds.openNote; S._uploading = false; go("avstamningar"); return; }
  if (ds.note) { S.noteSel = ds.note; S._uploading = false; S.parseMsg = ""; render(); return; }
  if (t.id === "add-ev") { addEventDialog(); return; }
  if (t.id === "add-gr") { addGroupDialog(); return; }
  if (t.id === "add-nw") { addNewsDialog(); return; }
  if (t.id === "add-rs") { addResourceDialog(); return; }
  if (t.id === "add-note") { addBoardNoteDialog(); return; }
  if (ds.plus) { if (!needDb()) plusDialog(ds.plus); return; }
  if (ds.delNote) {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Ta bort?"; t.classList.add("confirm"); setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ""; t.textContent = "×"; t.classList.remove("confirm"); } }, 3500); return; }
    if (needDb()) return;
    try { await S.db.doc("board/" + ds.delNote).delete(); toast("Lappen är borttagen"); } catch (err) { toast("Kunde inte ta bort."); }
    return;
  }
  if (ds.nwmode) { S.nwMode = ds.nwmode; render(); return; }
  if (ds.rtype != null) { S.rsType = ds.rtype; render(); return; }
  if (ds.editNet) { editNetworkDialog(ds.editNet); return; }
  if (t.id === "new-note") { S._uploading = true; S.parseMsg = ""; render(); return; }
  if (t.id === "nt-cancel") { S._uploading = false; S.parseMsg = ""; render(); return; }
  if (t.id === "nt-stop") { S._ctl && S._ctl.abort(); return; }
  if (t.id === "nt-save") {
    if (needDb()) return;
    const raw = $("#nt-text").value.trim(); const title = $("#nt-title").value.trim() || "Avstämning"; const date = $("#nt-date").value;
    S._draftText = raw; S._draftTitle = title; S._draftDate = date;
    if (!raw) { S.parseMsg = "Klistra in text eller välj en fil först."; render(); return; }
    if (S.sample) parseAndSave(raw, title, date);
    else { try { const ref = await S.db.collection("notes").add({ title, meetingDate: date, raw, parsed: null, createdAt: new Date().toISOString() }); S.noteSel = ref.id; S._uploading = false; S._draftText = ""; toast("Avstämningen är sparad"); render(); } catch (err) { S.parseMsg = "Kunde inte spara avstämningen."; render(); } }
    return;
  }
  if (ds.reparse) { const n = S.notes.find(x => x.id === ds.reparse); if (n && S.sample && !needDb()) parseAndSave(n.raw || "", n.title, n.meetingDate, n.id); return; }
  if (ds.suggGr != null) { const n = S.notes.find(x => x.id === S.noteSel); const g = n?.parsed?.suggestedGroups?.[Number(ds.suggGr)]; if (g) addGroupDialog(g); return; }
  if (ds.suggEv != null) { const n = S.notes.find(x => x.id === S.noteSel); const ev = n?.parsed?.suggestedEvents?.[Number(ds.suggEv)]; if (ev) addEventDialog(ev); return; }
  if (ds.delEv) {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Bekräfta borttagning"; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ""; t.textContent = "Ta bort"; } }, 4000); return; }
    if (needDb()) return;
    try { await S.db.doc("events/" + ds.delEv).delete(); toast("Träffen är borttagen"); } catch (err) { toast("Kunde inte ta bort."); }
    return;
  }
  if (ds.copy) {
    try { await navigator.clipboard.writeText(ds.copy); toast("Kopierat"); }
    catch (err) { const c = t.parentElement.querySelector("code"); const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Markerat – kopiera med Ctrl/Cmd+C"); }
    return;
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "ev-q") { S.evQ = e.target.value; render(); }
  if (id === "gr-q") { S.grQ = e.target.value; render(); }
  if (id === "nw-q") { S.nwQ = e.target.value; render(); }
  if (id === "rs-q") { S.rsQ = e.target.value; render(); }
  if (id === "nt-text") S._draftText = e.target.value;
  if (id === "nt-title") S._draftTitle = e.target.value;
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "ev-theme") { S.evTheme = el.value; render(); }
  if (el.id === "gr-theme") { S.grTheme = el.value; render(); }
  if (el.id === "nw-theme") { S.nwTheme = el.value; render(); }
  if (el.id === "rs-theme") { S.rsTheme = el.value; render(); }
  if (el.id === "nt-date") S._draftDate = el.value;
  if (el.dataset.status) {
    if (needDb()) return;
    try { await S.db.doc("groups/" + el.dataset.status).update({ status: el.value, updatedAt: new Date().toISOString() }); toast("Status uppdaterad"); }
    catch (err) { toast("Kunde inte uppdatera status."); render(); }
  }
  if (el.id === "nt-file" && el.files[0]) {
    const f = el.files[0];
    try {
      let text = "";
      if (/\.docx$/i.test(f.name)) {
        if (!window.mammoth) throw new Error("no-mammoth");
        const res = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
        text = res.value;
      } else text = await f.text();
      S._draftText = text.trim();
      if (!S._draftTitle) S._draftTitle = f.name.replace(/\.[^.]+$/, "");
      S.parseMsg = "Filen är inläst. Granska texten och spara.";
    } catch (err) { S.parseMsg = "Filen kunde inte läsas. Prova att klistra in texten i stället."; }
    render();
  }
});

// ---------- start ----------
const saved = load("kp-view"); if (saved && VIEWS.some(v => v.key === saved)) S.view = saved;
const hash = (location.hash || "").slice(1); if (VIEWS.some(v => v.key === hash)) S.view = hash;
(window.IT ? IT.auth.ready : Promise.resolve()).then(() => { if (authed()) { enter(); connect(); } });
</script>
