# Läser in nya synkfiler (data/sync/*.json) i Initiativtavlan när de hamnar på main.
# Kräver EN hemlighet i GitHub: Settings › Secrets and variables › Actions › SYNC_TOKEN
# (synknyckeln – kan bara lägga in automatiskt hämtade träffar, nyheter och källstatus).
name: Synka till Initiativtavlan
on:
  push:
    branches: [main]
    paths: ["data/sync/*.json"]
  workflow_dispatch:
    inputs:
      file:
        description: "Synkfil att läsa in (t.ex. data/sync/2026-11-02.json)"
        required: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Läs in synkfiler
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then echo "SYNC_TOKEN saknas i repots hemligheter."; exit 1; fi
          if [ -n "$INPUT_FILE" ]; then FILES="$INPUT_FILE"
          else FILES=$(git diff --name-only HEAD~1 HEAD -- 'data/sync/*.json'); fi
          for f in $FILES; do [ -f "$f" ] && node scripts/sync-push.mjs "$f"; done
